apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase14-bad
  namespace: claims-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: usecase14-demo, version: bad}
  template:
    metadata:
      labels: {app: usecase14-demo, version: bad}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /deliberately-unhealthy, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}