
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claimsdb
      POSTGRES_USER: claimsuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsuser -d claimsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_NAME: claimsdb
      DB_USER: claimsuser
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      DB_PORT: "5432"
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
