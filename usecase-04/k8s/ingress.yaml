apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claims-ingress
  namespace: claims-k8s-lab
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: claims-frontend
                port:
                  number: 8080