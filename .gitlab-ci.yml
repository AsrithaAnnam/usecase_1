```yaml
image: python:3.12

stages:
  - test
  - sonarqube
  - build_scan_push

unit_tests:
  stage: test
  tags:
    - docker
  before_script:
    - python --version
    - pip install -r backend/requirements.txt
    - pip install pytest pytest-cov
  script:
    - python -m pytest backend/tests -v --cov=backend.app --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 day

sonarqube_check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  tags:
    - docker
  needs:
    - job: unit_tests
      artifacts: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.python.coverage.reportPaths=coverage.xml
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

container_build_scan_push:
  stage: build_scan_push
  image:
    name: docker:27-cli
    entrypoint: [""]
  tags:
    - docker
  variables:
    BACKEND_IMAGE: "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}"
    FRONTEND_IMAGE: "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}"
  before_script:
    - docker version
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    # Build the backend image
    - docker build -t "$BACKEND_IMAGE" -f backend/Dockerfile backend

    # Build the frontend image
    - docker build -t "$FRONTEND_IMAGE" -f frontend/Dockerfile frontend

    # Scan the backend image for High and Critical vulnerabilities
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --db-repository registry.gitlab.com/gitlab-org/security-products/dependencies/trivy-db --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$BACKEND_IMAGE"

    # Scan the frontend image for High and Critical vulnerabilities
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --db-repository registry.gitlab.com/gitlab-org/security-products/dependencies/trivy-db --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress "$FRONTEND_IMAGE"

    # Push images only after both scans pass
    - docker push "$BACKEND_IMAGE"
    - docker push "$FRONTEND_IMAGE"

    # Also publish latest tags from the main branch
    - docker tag "$BACKEND_IMAGE" "${CI_REGISTRY_IMAGE}/backend:latest"
    - docker tag "$FRONTEND_IMAGE" "${CI_REGISTRY_IMAGE}/frontend:latest"
    - docker push "${CI_REGISTRY_IMAGE}/backend:latest"
    - docker push "${CI_REGISTRY_IMAGE}/frontend:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
