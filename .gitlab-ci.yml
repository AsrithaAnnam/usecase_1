
image: python:3.12

stages:
  - test
  - sonarqube
  - build
  - scan
  - push

variables:
  BACKEND_IMAGE: "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}"
  FRONTEND_IMAGE: "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}"
  BACKEND_LATEST: "${CI_REGISTRY_IMAGE}/backend:latest"
  FRONTEND_LATEST: "${CI_REGISTRY_IMAGE}/frontend:latest"

# Stage 1: Run unit tests and generate coverage
unit_tests:
  stage: test
  tags:
    - docker
  before_script:
    - python --version
    - pip install -r backend/requirements.txt
    - pip install pytest pytest-cov
  script:
    - python -m pytest backend/tests -v --cov=backend.app --cov-report=xml:coverage.xml
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 day

# Stage 2: Analyze code using SonarQube
sonarqube_check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  tags:
    - docker
  needs:
    - job: unit_tests
      artifacts: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "sonar-cache-${CI_COMMIT_REF_SLUG}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.python.coverage.reportPaths=coverage.xml
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Stage 3: Build both Docker images
container_build:
  stage: build
  image:
    name: docker:27-cli
    entrypoint: [""]
  tags:
    - docker
  script:
    - docker version
    - docker build --pull --no-cache -t "$BACKEND_IMAGE" -f backend/Dockerfile backend
    - docker build --pull --no-cache -t "$FRONTEND_IMAGE" -f frontend/Dockerfile frontend
    - docker save -o images.tar "$BACKEND_IMAGE" "$FRONTEND_IMAGE"
  artifacts:
    paths:
      - images.tar
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Stage 4: Scan both images with Trivy
container_scan:
  stage: scan
  image:
    name: docker:27-cli
    entrypoint: [""]
  tags:
    - docker
  needs:
    - job: container_build
      artifacts: true
  script:
    - docker version
    - docker load -i images.tar
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$BACKEND_IMAGE"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0 image --db-repository public.ecr.aws/aquasecurity/trivy-db:2 --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$FRONTEND_IMAGE"
  artifacts:
    paths:
      - images.tar
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Stage 5: Push images only after both scans pass
container_push:
  stage: push
  image:
    name: docker:27-cli
    entrypoint: [""]
  tags:
    - docker
  needs:
    - job: container_scan
      artifacts: true
  before_script:
    - docker version
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker load -i images.tar
    - docker push "$BACKEND_IMAGE"
    - docker push "$FRONTEND_IMAGE"
    - docker tag "$BACKEND_IMAGE" "$BACKEND_LATEST"
    - docker tag "$FRONTEND_IMAGE" "$FRONTEND_LATEST"
    - docker push "$BACKEND_LATEST"
    - docker push "$FRONTEND_LATEST"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
