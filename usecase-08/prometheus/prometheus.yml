global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: claims-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:5001
        labels:
          service: claims-backend
          environment: local