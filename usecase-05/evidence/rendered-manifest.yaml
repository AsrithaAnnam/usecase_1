# Source: claims/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-backend
  template:
    metadata:
      labels:
        app: claims-backend
    spec:
      imagePullSecrets:
        - name: gitlab-pull-secret
      containers:
        - name: backend
          image: "registry.gitlab.com/asrithaannam/usecase_1/backend@sha256:fde7e187d075c512bda9f2e1fd35ba96caa6ddb07818d7c8a1f548be771dc376"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: claims-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "claims-db-secret"
                  key: "DB_PASSWORD"
          readinessProbe:
            httpGet:
              path: "/api/health"
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/api/health"
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
# Source: claims/templates/database-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claims-db
  template:
    metadata:
      labels:
        app: claims-db
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: claims-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "claims-db-secret"
                  key: "DB_PASSWORD"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
            - name: database-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: claims-db-data
        - name: database-init
          configMap:
            name: claims-db-init
---
