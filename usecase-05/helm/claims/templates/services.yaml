apiVersion: v1
kind: Service
metadata:
  name: claims-db
spec:
  type: ClusterIP
  selector:
    app: claims-db
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: claims-backend
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: claims-frontend
spec:
  type: ClusterIP
  selector:
    app: claims-frontend
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}